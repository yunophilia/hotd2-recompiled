<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOTD2 Recompiled</title>
<style>
	:root { --bg: #0b0b0d; --fg: #e8e6e3; --muted: #8a8780; --accent: #c8322a; }
	* { box-sizing: border-box; }
	body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
	main { max-width: 960px; margin: 0 auto; padding: 16px; }
	h1 { font-size: 18px; margin: 0 0 4px; }
	p.sub { margin: 0 0 12px; color: var(--muted); }
	#stage { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #000; }
	canvas { width: 100%; height: 100%; display: block; cursor: crosshair; image-rendering: auto; }
	#overlay { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; }
	#overlay[hidden] { display: none; }
	.picker { display: grid; gap: 10px; justify-items: center; }
	button { background: var(--accent); color: #fff; border: 0; padding: 8px 16px; font: inherit; cursor: pointer; }
	#stats { margin-top: 8px; color: var(--muted); font: 12px ui-monospace, monospace; }
	#log { margin-top: 8px; height: 140px; overflow: auto; font: 12px/1.35 ui-monospace, monospace; color: var(--muted); white-space: pre-wrap; }
	kbd { border: 1px solid #444; padding: 0 4px; border-radius: 3px; }
	#stage:fullscreen { display: grid; place-items: center; background: #000; }
	#stage:fullscreen canvas { width: min(100vw, calc(100vh * 4 / 3)); height: auto; aspect-ratio: 4 / 3; }
	.bar { display: flex; gap: 12px; align-items: center; justify-content: space-between; margin-top: 8px; }
	.bar button { padding: 4px 10px; font-size: 12px; }
</style>
</head>
<body>
<main>
	<h1>The House of the Dead 2 — recompiled</h1>
	<p class="sub">Mouse = gun (left button fires, right button reloads) · <kbd>5</kbd> coin, then <kbd>1</kbd> or <kbd>Enter</kbd> start · <kbd>9</kbd> test (<kbd>0</kbd> service) · <kbd>F</kbd> fullscreen</p>
	<div id="stage">
		<canvas id="screen" width="640" height="480"></canvas>
		<div id="overlay">
			<div class="picker">
				<div>Load your own <b>hotd2.zip</b> (NAOMI set). It stays in this browser.</div>
				<input type="file" id="rom" accept=".zip">
				<button id="dev" hidden>Use local dev ROM</button>
			</div>
		</div>
	</div>
	<div class="bar"><div id="stats"></div><button id="fullscreen" hidden>Fullscreen</button></div>
	<div id="log"></div>
</main>
<script type="module" src="main.js"></script>
</body>
</html>
