<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOTD2 Web</title>
<style>
	:root { --bg: #0b0b0d; --fg: #e8e6e3; --muted: #8a8780; --accent: #c8322a; }
	* { box-sizing: border-box; }
	body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
	main { max-width: 960px; margin: 0 auto; padding: 16px; }
	h1 { font-size: 18px; margin: 0 0 12px; letter-spacing: .02em; }
	#stage { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #000; }
	canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
	#overlay { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; }
	#overlay[hidden] { display: none; }
	.picker { display: grid; gap: 10px; justify-items: center; }
	label { color: var(--muted); }
	button { background: var(--accent); color: #fff; border: 0; padding: 8px 16px; font: inherit; cursor: pointer; }
	button:disabled { opacity: .4; cursor: default; }
	#log { margin-top: 12px; height: 160px; overflow: auto; font: 12px/1.35 ui-monospace, monospace; color: var(--muted); white-space: pre-wrap; }
</style>
</head>
<body>
<main>
	<h1>The House of the Dead 2 — web build (Flycast reference)</h1>
	<div id="stage">
		<canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
		<div id="overlay">
			<div class="picker">
				<div>Load your own NAOMI dump. Files stay in this browser.</div>
				<label>hotd2.zip <input type="file" id="rom" accept=".zip"></label>
				<label>hod2bios.zip <input type="file" id="bios" accept=".zip"></label>
				<button id="start" disabled>Start</button>
				<button id="dev" hidden>Use local dev ROMs</button>
			</div>
		</div>
	</div>
	<div id="log"></div>
</main>
<script src="main.js"></script>
</body>
</html>
